<svg width="512" height="512" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity=".18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="40" height="40" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <rect width="40" height="40" rx="10" fill="url(#halo)"/>

  <!-- AI signal arcs -->
  <g clip-path="url(#clip)">
    <path d="M12 27 Q20 17 28 27" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".7"/>
    <path d="M8 31  Q20 13 32 31"  stroke="white" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".45"/>
    <path d="M4 35  Q20 9  36 35"  stroke="white" stroke-width="0.9" stroke-linecap="round" fill="none" opacity=".25"/>
  </g>

  <!-- Head -->
  <circle cx="20" cy="12" r="4" fill="white"/>

  <!-- Circuit wires from head -->
  <line x1="16.5" y1="10" x2="14.5" y2="8.2" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
  <line x1="20"   y1="8"  x2="20"   y2="6"   stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
  <line x1="23.5" y1="10" x2="25.5" y2="8.2" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>

  <!-- Terminal dots -->
  <circle cx="14"  cy="7.8" r=".9" fill="white" opacity=".7"/>
  <circle cx="20"  cy="5.5" r=".9" fill="white" opacity=".7"/>
  <circle cx="26"  cy="7.8" r=".9" fill="white" opacity=".7"/>

  <!-- Torso (upward chevron) -->
  <path d="M17 16 L20 22 L23 16" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Legs -->
  <path d="M18.5 21 L16 30" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M21.5 21 L24 30" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Spark node -->
  <circle cx="20" cy="5.5" r="2" fill="#c4b5fd" opacity=".9"/>
</svg>
