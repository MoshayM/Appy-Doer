<svg width="512" height="512" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>

  <!-- Left floppy ear (behind head) -->
  <path d="M13 11 C6 11, 2 19, 3 26 C4 33, 10 36, 14 32 C17 29, 17 20, 14 14 Z"
    fill="white" opacity=".86"/>

  <!-- Right floppy ear (behind head) -->
  <path d="M27 11 C34 11, 38 19, 37 26 C36 33, 30 36, 26 32 C23 29, 23 20, 26 14 Z"
    fill="white" opacity=".86"/>

  <!-- Head -->
  <circle cx="20" cy="21" r="12" fill="white"/>

  <!-- Head shine highlight -->
  <path d="M14 14 Q20 11 26 14" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".3"/>

  <!-- Left eye + shine -->
  <circle cx="15"   cy="19.5" r="3"   fill="#312e81"/>
  <circle cx="16.3" cy="18"   r="1.1" fill="white" opacity=".9"/>

  <!-- Right eye + shine -->
  <circle cx="25"   cy="19.5" r="3"   fill="#312e81"/>
  <circle cx="26.3" cy="18"   r="1.1" fill="white" opacity=".9"/>

  <!-- Nose + highlight -->
  <ellipse cx="20"   cy="25.5" rx="2.5" ry="1.8"  fill="#312e81"/>
  <ellipse cx="18.8" cy="24.8" rx=".9"  ry=".65"  fill="white" opacity=".4"/>

  <!-- Smile -->
  <path d="M16 27.5 Q20 32 24 27.5"
    stroke="#312e81" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Tongue -->
  <ellipse cx="20" cy="32"   rx="2.8" ry="2.6" fill="#f43f5e"/>
  <ellipse cx="20" cy="33.8" rx="2.8" ry="1"   fill="#e11d48"/>
  <line x1="20" y1="30" x2="20" y2="34.5" stroke="#e11d48" stroke-width=".8" stroke-linecap="round"/>
</svg>
