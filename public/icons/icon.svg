<svg width="512" height="512" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="white" stop-opacity=".2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <rect width="40" height="40" rx="10" fill="url(#halo)" opacity=".12"/>

  <!-- "A" legs -->
  <path d="M8 33 L20 7 L32 33" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Crossbar -->
  <line x1="13" y1="23" x2="27" y2="23" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Circuit nodes -->
  <circle cx="13" cy="23" r="2.2" fill="#a5b4fc" opacity=".75"/>
  <circle cx="20" cy="23" r="2.2" fill="#c4b5fd" opacity=".85"/>
  <circle cx="27" cy="23" r="2.2" fill="#a5b4fc" opacity=".75"/>

  <!-- Apex glow + spark -->
  <circle cx="20" cy="7" r="5" fill="#6d28d9" opacity=".4"/>
  <circle cx="20" cy="7" r="3.5" fill="#c4b5fd" opacity=".85"/>
  <circle cx="20" cy="7" r="1.7" fill="white" opacity=".95"/>
</svg>
